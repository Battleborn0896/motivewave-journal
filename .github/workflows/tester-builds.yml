name: Build tester apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -r desktop/windows/requirements-build.txt
      - name: Install test dependency
        run: python -m pip install 'pytest>=8'
      - name: Run Python test suite
        run: python -m pytest -q -p no:cacheprovider
      - name: Build portable Windows app
        run: python scripts/build_windows.py
      - name: Inspect portable Windows package
        shell: pwsh
        run: |
          $zip = 'build/windows/MotiveWave-Journal-Windows-x64.zip'
          if (!(Test-Path $zip)) { throw "Missing Windows tester ZIP" }
          $listing = tar -tf $zip
          if (!($listing -match 'MotiveWave Journal.exe$')) { throw "ZIP is missing the launcher" }
          if (!($listing -match 'motivewave-journal.jar$')) { throw "ZIP is missing the study JAR" }
          if (!($listing -match 'journal/\.streamlit/config\.toml$')) { throw "ZIP is missing the Streamlit settings" }
          foreach ($font in 'Regular', 'Italic', 'Medium', 'SemiBold', 'Bold') {
            if (!($listing -match ('app/static/fonts/IBMPlexSans-{0}\.woff2$' -f $font))) { throw "ZIP is missing IBM Plex Sans $font" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: MotiveWave-Journal-Windows-x64
          path: build/windows/MotiveWave-Journal-Windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install runtime and packaging dependencies
        run: python -m pip install -r requirements.txt 'pyinstaller>=6.16,<7' 'pytest>=8'
      - name: Run Python test suite
        run: python -m pytest -q -p no:cacheprovider
      - name: Build self-contained macOS DMG
        run: python scripts/build_macos_release.py --target-arch arm64
      - uses: actions/upload-artifact@v7
        with:
          name: MotiveWave-Journal-macOS
          path: build/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: MotiveWave-Journal-*
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: sha256sum MotiveWave-Journal-*.dmg MotiveWave-Journal-Windows-x64.zip > SHA256SUMS.txt
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Write the release notes
        shell: bash
        run: python3 source/scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: MotiveWave Journal ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          # What is new in this version (README.md), how to update from an older one, how to install.
          body_path: release-notes.md
          files: |
            MotiveWave-Journal-*.dmg
            MotiveWave-Journal-Windows-x64.zip
            SHA256SUMS.txt
