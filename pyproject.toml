[project]
name = "motivewave-journal"
version = "0.4.16"
description = "A local trade journal for MotiveWave: a study captures live and replay trades, the app reviews them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["streamlit>=1.49", "pandas>=2.2", "plotly>=5.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["mwjournal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]
