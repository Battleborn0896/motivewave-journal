<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'">
<style>
/* IBM Plex Sans from the app's bundled files: this page is <app>/component/checklist_editor.journal_checklist_editor/index.html
   and Streamlit serves app/static at <app>/app/static/. */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:block;src:url("../../app/static/fonts/IBMPlexSans-Regular.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:italic;font-weight:400;font-display:block;src:url("../../app/static/fonts/IBMPlexSans-Italic.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:block;src:url("../../app/static/fonts/IBMPlexSans-Medium.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:block;src:url("../../app/static/fonts/IBMPlexSans-SemiBold.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:block;src:url("../../app/static/fonts/IBMPlexSans-Bold.woff2") format("woff2")}
*{box-sizing:border-box}body{margin:0;background:#1d1e1f;color:#e8e8e5;font:13px "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button,input,select,textarea{font:inherit;background:#272829;color:#e8e8e5;border:1px solid #414345;border-radius:4px;padding:6px}button{cursor:pointer}button:focus-visible{outline:2px solid #e2cf32}button.primary{background:#e2cf32;color:#111213}#toolbar{display:flex;gap:5px;padding:8px;flex-wrap:wrap}#shell{display:grid;grid-template-columns:190px 1fr;height:450px}#props{padding:10px;border-right:1px solid #414345;overflow:auto}#props input,#props textarea,#props select{width:100%;margin:5px 0 10px}#stage{position:relative;overflow:auto;background:radial-gradient(#414345 1px,transparent 1px) 0 0/18px 18px}#world{position:relative;min-width:1800px;min-height:1200px;transform-origin:top left}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;width:170px;min-height:80px;background:#202224;border:2px solid #e2cf32;border-radius:6px;padding:8px;cursor:grab;white-space:pre-wrap}.node.answer{border-style:dashed}.node.selected{box-shadow:0 0 0 3px #60a9e8}.node .kind{font-size:10px;text-transform:uppercase;opacity:.65}.node .port{position:absolute;bottom:-8px;right:18px;border-radius:50%;width:15px;height:15px;background:#ed9b55;padding:0;border:none}.node .port.in{top:-8px;bottom:auto;left:18px}.hint{font-size:11px;color:#959a94;padding:5px}#notice{padding:5px 10px;color:#e2cf32}#tags{height:120px}
</style></head><body>
<div id="toolbar"><button data-add="question">+ Question</button><button data-add="answer">+ Answer</button><button data-add="pass">+ Pass</button><button data-add="counter">+ Counter</button><button id="duplicate">Duplicate</button><button id="remove">Remove</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="fit">Fit</button><button id="align">Align</button><button id="save" class="primary">Save graph</button></div>
<div id="notice">Click a node to edit. Drag to move. Connect orange output → input. Shift-click for multi-select.</div>
<div id="shell"><aside id="props"><label>Node text<textarea id="text" rows="3"></textarea></label><label>Color<input id="color" type="color" value="#e2cf32"></label><label>Attached tags<select id="tags" multiple></select></label><button id="start">Start here</button><button id="unlink">Clear outgoing links</button><div class="hint">Tags are collected in the run. Apply them explicitly to the selected trade; this cannot send orders.</div></aside><div id="stage"><div id="world"><svg id="links"></svg></div></div></div>
<script>
'use strict';
let graph=null, initial='', selected=new Set(), pending=null, undo=[], redo=[], seq=0, tagOptions=[], zoom=1;
const $=id=>document.getElementById(id), copy=v=>JSON.parse(JSON.stringify(v));
function post(type,data){parent.postMessage(Object.assign({isStreamlitMessage:true,type},data||{}),'*')}
function checkpoint(){undo.push(copy(graph));if(undo.length>100)undo.shift();redo=[]}
function node(id){return graph.nodes.find(n=>n.id===id)}
function id(){return 'n_'+crypto.randomUUID().replaceAll('-','')}
function notice(text){$('notice').textContent=text}
function draw(){
 $('world').querySelectorAll('.node').forEach(n=>n.remove());$('links').replaceChildren();
 for(const n of graph.nodes){
  const el=document.createElement('div');el.className='node '+n.kind+(selected.has(n.id)?' selected':'');el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.borderColor=n.color||'#e2cf32';el.dataset.id=n.id;
  const kind=document.createElement('div');kind.className='kind';kind.textContent=n.kind+(graph.start===n.id?' · START':'');el.append(kind);
  const text=document.createElement('div');text.textContent=n.text;el.append(text);
  for(const input of [true,false]){const p=document.createElement('button');p.className='port'+(input?' in':'');p.setAttribute('aria-label',(input?'Input ':'Output ')+n.text);p.onclick=e=>{e.stopPropagation();if(!input){pending=n.id;notice('Now click the input port of the next node.')}else if(pending){if(pending!==n.id){checkpoint();const from=node(pending);from.next=from.kind==='question'?[...new Set([...from.next,n.id])]:[n.id];}pending=null;draw();notice('Link added. Save graph to keep your changes.')}};el.append(p)}
  el.onclick=e=>{if(e.target.tagName==='BUTTON')return;if(e.shiftKey){selected.has(n.id)?selected.delete(n.id):selected.add(n.id)}else selected=new Set([n.id]);draw();properties()};
  el.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;const x=e.clientX,y=e.clientY;let moved=false;if(!selected.has(n.id))selected=new Set([n.id]);const origins=[...selected].map(i=>({id:i,x:node(i).x,y:node(i).y}));el.setPointerCapture(e.pointerId);el.onpointermove=p=>{if(!moved&&Math.abs(p.clientX-x)+Math.abs(p.clientY-y)>4){checkpoint();moved=true}if(moved){for(const o of origins){node(o.id).x=Math.max(0,o.x+(p.clientX-x)/zoom);node(o.id).y=Math.max(0,o.y+(p.clientY-y)/zoom);const item=$('world').querySelector('[data-id="'+o.id+'"]');item.style.left=node(o.id).x+'px';item.style.top=node(o.id).y+'px'}lines()}};el.onpointerup=()=>{el.onpointermove=null;if(moved){draw();properties();notice('Position changed. Save graph to keep it.')}}};
  $('world').append(el)
 }lines()
}
function lines(){const svg=$('links');svg.replaceChildren();for(const n of graph.nodes)for(const to of n.next||[]){const target=node(to);if(!target)continue;const line=document.createElementNS('http://www.w3.org/2000/svg','path');const x=n.x+145,y=n.y+80,tx=target.x+25,ty=target.y;line.setAttribute('d',`M${x},${y} C${x},${y+50} ${tx},${ty-50} ${tx},${ty}`);line.setAttribute('fill','none');line.setAttribute('stroke','#ed9b55');line.setAttribute('stroke-width','2');svg.append(line)}}
function properties(){const n=node([...selected][0]);$('text').value=n?n.text:'';$('color').value=n?n.color:'#e2cf32';for(const option of $('tags').options)option.selected=!!n&&(n.tag_ids||[]).includes(option.value)}
function change(field,value){if(!selected.size)return;checkpoint();for(const i of selected)node(i)[field]=value;draw()}
$('text').oninput=()=>change('text',$('text').value);$('color').oninput=()=>change('color',$('color').value);$('tags').onchange=()=>change('tag_ids',[...$('tags').selectedOptions].map(o=>o.value));
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{checkpoint();const n={id:id(),kind:b.dataset.add,text:b.dataset.add==='question'?'New question':'New '+b.dataset.add,next:[],tag_ids:[],x:40+(graph.nodes.length%5)*200,y:40+Math.floor(graph.nodes.length/5)*130,color:'#e2cf32'};graph.nodes.push(n);selected=new Set([n.id]);draw();properties()});
$('start').onclick=()=>{if(selected.size){checkpoint();graph.start=[...selected][0];draw()}};
$('unlink').onclick=()=>{checkpoint();for(const i of selected)node(i).next=[];draw()};
$('duplicate').onclick=()=>{checkpoint();const clones=[...selected].map(i=>({...copy(node(i)),id:id(),x:node(i).x+30,y:node(i).y+30,next:[]}));graph.nodes.push(...clones);selected=new Set(clones.map(n=>n.id));draw();properties()};
$('remove').onclick=()=>{if(!selected.size)return;checkpoint();graph.nodes=graph.nodes.filter(n=>!selected.has(n.id));for(const n of graph.nodes)n.next=n.next.filter(i=>!selected.has(i));if(selected.has(graph.start))graph.start=graph.nodes[0]?.id||null;selected.clear();draw();properties()};
$('undo').onclick=()=>{if(undo.length){redo.push(copy(graph));graph=undo.pop();selected.clear();draw();properties()}};
$('redo').onclick=()=>{if(redo.length){undo.push(copy(graph));graph=redo.pop();selected.clear();draw();properties()}};
$('align').onclick=()=>{checkpoint();[...selected].forEach((id,i)=>{node(id).x=40+i*200;node(id).y=50});draw()};
$('fit').onclick=()=>{const max=Math.max(400,...graph.nodes.map(n=>n.x+190));zoom=Math.min(1,$('stage').clientWidth/max);$('world').style.transform=`scale(${zoom})`;$('stage').scrollTo(0,0)};
$('save').onclick=()=>{post('streamlit:setComponentValue',{value:{graph:copy(graph),seq:++seq},dataType:'json'});notice('Sent for validation and local save.')};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click()}if(e.key==='Delete')$('remove').click();if(e.key==='f')$('fit').click()});
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='streamlit:render')return;const args=e.data.args;tagOptions=args.tags;const sig=JSON.stringify(args.graph);if(!graph||initial!==sig){graph=copy(args.graph);initial=sig;selected.clear();undo=[];redo=[]}const select=$('tags');select.replaceChildren();for(const t of tagOptions){const option=document.createElement('option');option.value=t.id;option.textContent=t.name;select.append(option)}draw();properties();post('streamlit:setFrameHeight',{height:550})});
post('streamlit:componentReady',{apiVersion:1});
</script></body></html>
