<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The chart of MotiveWave Journal, drawn with TradingView's Lightweight Charts.
  Scroll to zoom, drag to pan, the price scale fits what is on screen, a crosshair with labels,
  levels as price lines on the axis. Double-click resets the view. The chart lives across
  Streamlit reruns: new data replaces the old in place, and a view the user has zoomed or
  panned is kept.

  It speaks Streamlit's component protocol directly (componentReady, render, setFrameHeight),
  so there is no build step.

  Text is IBM Plex Sans, from the app's bundled files (app/static/fonts, served by Streamlit at
  <app>/app/static/; this page is <app>/component/tvchart.tvchart/index.html, hence ../../). The axes
  and watermark are drawn on a canvas, which does not redraw when a font arrives, so the chart waits
  for the font before it draws.
-->
<style>
  @font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 400; font-display: block;
               src: url("../../app/static/fonts/IBMPlexSans-Regular.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-style: italic; font-weight: 400; font-display: block;
               src: url("../../app/static/fonts/IBMPlexSans-Italic.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 500; font-display: block;
               src: url("../../app/static/fonts/IBMPlexSans-Medium.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 600; font-display: block;
               src: url("../../app/static/fonts/IBMPlexSans-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 700; font-display: block;
               src: url("../../app/static/fonts/IBMPlexSans-Bold.woff2") format("woff2"); }
  :root { --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: var(--font); }
  #wrap { position: relative; border-radius: 6px; overflow: hidden; }
  #title { position: absolute; left: 12px; top: 8px; z-index: 4; pointer-events: none;
           font: 700 11.5px/1.4 var(--font); letter-spacing: .1em; text-transform: uppercase;
           max-width: calc(100% - 90px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend { position: absolute; left: 12px; z-index: 4; pointer-events: none; font: 11.5px/1.55 var(--font);
            font-variant-numeric: tabular-nums;
            display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: calc(100% - 110px);
            padding: 2px 6px; margin-left: -6px; border-radius: 4px; background: var(--legend-bg, transparent); }
  #legend .item { white-space: nowrap; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  #legend .name { margin-right: 6px; }
  #hint { position: absolute; right: 70px; bottom: 34px; z-index: 4; pointer-events: none;
          font: 10.5px/1 var(--font); opacity: 0; transition: opacity .3s; }
  #wrap:hover #hint { opacity: .55; }
  #trade-overlay { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }
  #trade-overlay text { font-variant-numeric: tabular-nums; }
  /* A fill arrow's details. Drawn here rather than as an SVG <title>, which the browser shows in the
     system's font. */
  #fill-tip { position: absolute; z-index: 5; pointer-events: none; font: 11.5px/1.45 var(--font);
              font-variant-numeric: tabular-nums; white-space: pre; padding: 6px 8px; border-radius: 4px;
              color: var(--tip-ink, #e8e8e5); background: var(--tip-bg, #272829);
              border: 1px solid var(--tip-border, #414345); box-shadow: 0 4px 12px rgba(0, 0, 0, .35); }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="wrap"><div id="title"></div><div id="legend"></div><div id="chart"></div><svg id="trade-overlay"></svg>
  <div id="hint">scroll zoom · drag pan · double-click reset</div><div id="fill-tip" role="tooltip" hidden></div></div>
<script>
const LC = window.LightweightCharts;
const STYLE = { solid: LC.LineStyle.Solid, dotted: LC.LineStyle.Dotted, dashed: LC.LineStyle.Dashed,
                large: LC.LineStyle.LargeDashed, sparse: LC.LineStyle.SparseDotted };
let chart = null, entries = [], signature = null, userMoved = false, spec = null, overlayFrame = 0;
let hover = null;                          // the bar under the pointer, so a redraw keeps its legend
// The canvas keeps whatever font it first drew with, so the first drawing waits for IBM Plex Sans (a
// local file, normally a few milliseconds; at most three seconds). A font that arrives later still
// gets the chart redrawn in it. The fills' boxes are sized to their text, in the semibold face.
let fontLate = false;
const FONT_FACES = ['400 11px "IBM Plex Sans"', '600 10px "IBM Plex Sans"', '700 11px "IBM Plex Sans"'];
const fontLoaded = document.fonts ? Promise.all(FONT_FACES.map(face => document.fonts.load(face))).catch(() => null)
                                  : Promise.resolve(null);
const fontReady = Promise.race([fontLoaded.then(() => 'loaded'),
                                new Promise(resolve => setTimeout(() => resolve('late'), 3000))])
  .then(result => { fontLate = result === 'late'; });
fontLoaded.then(() => {
  if (!fontLate || !spec) return;
  fontLate = false;
  signature = null;                        // rebuilt, so the axes measure their labels again
  try { render({ spec: spec }); } catch (err) { /* the next render from Streamlit draws it */ }
});
const escapeText = v => String(v == null ? '' : v).replace(/[&<>"']/g, c =>
  ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));

function timeLabel(time, full = false) {
  // The journal's display time zone, written as the rest of the journal writes it: '11:52 AM' on the
  // axis, 'Oct 15, 11:52:42 AM EDT' under the crosshair and on a fill.
  return new Intl.DateTimeFormat('en-US', {timeZone: spec.timezone || 'UTC', hour: 'numeric',
    minute: '2-digit', hour12: true, ...(full ? {month:'short', day:'numeric', second:'2-digit', timeZoneName:'short'} : {})})
    .format(new Date(Number(time) * 1000));
}

function post(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), '*');
}

function formatter(fmt) {
  const p = fmt && fmt.precision != null ? fmt.precision : 2;
  const pre = (fmt && fmt.prefix) || '', suf = (fmt && fmt.suffix) || '';
  return v => (v == null || isNaN(v)) ? '–'
    : pre + Number(v).toLocaleString('en-US', { minimumFractionDigits: p, maximumFractionDigits: p }) + suf;
}

function sig(s) {
  return JSON.stringify([s.height, s.intraday, s.timezone, !!s.tradeOverlays,
    s.series.map(x => [x.type, x.name, x.scale || 'right', !!x.volume])]);
}

function build(s) {
  const el = document.getElementById('chart');
  if (chart) { chart.remove(); chart = null; }
  const t = s.theme;
  const hasCandles = s.series.some(x => x.type === 'candles');
  document.documentElement.style.setProperty('--font', t.font);
  document.getElementById('wrap').style.background = t.surface;
  document.getElementById('wrap').style.border = '1px solid ' + t.border;
  document.getElementById('title').style.color = t.ink;
  document.getElementById('legend').style.top = s.title ? '28px' : '8px';
  document.documentElement.style.setProperty('--legend-bg', t.surface + 'E6');
  [['--tip-bg', t.label], ['--tip-ink', t.ink], ['--tip-border', t.border]].forEach(([name, value]) => {
    if (value) document.documentElement.style.setProperty(name, value);
  });
  document.getElementById('hint').style.color = t.muted;
  chart = LC.createChart(el, {
    height: s.height, autoSize: false, width: el.clientWidth || document.body.clientWidth,
    // No logo on the chart: the library's attribution notice and its link are in the app's sidebar,
    // on every view (see VENDOR.txt). Price charts get a faint grid both ways.
    layout: { background: { type: 'solid', color: t.surface }, textColor: t.muted, fontFamily: t.font, fontSize: 11,
              attributionLogo: false },
    grid: { vertLines: { visible: hasCandles, color: t.grid }, horzLines: { color: t.grid, style: LC.LineStyle.Solid } },
    crosshair: { mode: LC.CrosshairMode.Normal,
                 vertLine: { color: t.crosshair, width: 1, style: LC.LineStyle.LargeDashed, labelBackgroundColor: t.label },
                 horzLine: { color: t.crosshair, width: 1, style: LC.LineStyle.LargeDashed, labelBackgroundColor: t.label } },
    kineticScroll: { mouse: true, touch: true },
    rightPriceScale: { borderVisible: false,
                       scaleMargins: { top: s.title ? 0.2 : 0.12, bottom: s.series.some(x => x.volume) ? 0.2 : 0.08 } },
    leftPriceScale: { visible: s.series.some(x => x.scale === 'left'), borderVisible: false },
    timeScale: { borderVisible: false, timeVisible: !!s.intraday, secondsVisible: false,
                 rightOffset: 8, barSpacing: 7, minBarSpacing: 0.05,
                 ...(s.timezone ? {tickMarkFormatter: time => timeLabel(time)} : {}) },
    localization: { priceFormatter: formatter(s.format),
                    ...(s.timezone ? {timeFormatter: time => timeLabel(time, true)} : {}) },
    watermark: s.watermark ? { visible: true, text: s.watermark, color: t.watermark, fontSize: 40,
                               fontFamily: t.font, fontStyle: '700', horzAlign: 'center', vertAlign: 'center' }
                           : { visible: false },
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: true },
                   axisDoubleClickReset: { time: true, price: true } },
  });
  entries = s.series.map(x => {
    const fmt = x.format || s.format;
    const common = { title: x.label || '', lastValueVisible: x.lastValue !== false, priceLineVisible: !!x.priceLine,
                     priceScaleId: x.scale || 'right',
                     priceFormat: { type: 'custom', formatter: formatter(fmt),
                                    minMove: Math.pow(10, -((fmt && fmt.precision != null) ? fmt.precision : 2)) } };
    let api;
    if (x.type === 'candles') {
      api = chart.addCandlestickSeries(Object.assign(common, {
        upColor: t.candleUp, downColor: t.candleDown, borderUpColor: t.candleUp, borderDownColor: t.candleDown,
        wickUpColor: t.candleUp, wickDownColor: t.candleDown, priceLineVisible: true,
        autoscaleInfoProvider: original => {
          const info = original();
          if (!info || !spec.tradeOverlays) return info;
          const range = chart.timeScale().getVisibleRange();
          const fills = (spec.tradeOverlays.fills || []).filter(f => !range ||
            (f.time >= range.from && f.time <= range.to));
          const levels = (spec.tradeOverlays.levels || []).filter(l => !range || l.full ||
            (l.to >= range.from && l.from <= range.to));
          const values = [...fills, ...levels].map(p => p.price).filter(Number.isFinite);
          if (values.length) info.priceRange = {
            minValue: Math.min(info.priceRange.minValue, ...values),
            maxValue: Math.max(info.priceRange.maxValue, ...values)};
          return info;
        },
        priceLineStyle: LC.LineStyle.Dotted }));
      if (x.volume) {
        // Volume in its own band along the bottom, as on TradingView.
        const vol = chart.addHistogramSeries({ priceScaleId: 'volume', priceFormat: { type: 'volume' },
                                               lastValueVisible: false, priceLineVisible: false });
        chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.84, bottom: 0 }, visible: false });
        return { spec: x, api: api, lines: [], volume: vol };
      }
    } else if (x.type === 'area') {
      api = chart.addAreaSeries(Object.assign(common, { lineColor: x.color, lineWidth: x.width || 2,
        lineType: x.curved ? LC.LineType.Curved : LC.LineType.Simple, pointMarkersVisible: !!x.points,
        pointMarkersRadius: 2.5, topColor: x.fill || (x.color + '38'), bottomColor: x.color + '00', crosshairMarkerRadius: 4,
        crosshairMarkerBorderColor: t.surface }));
    } else if (x.type === 'histogram') {
      api = chart.addHistogramSeries(Object.assign(common, { color: x.color, base: 0 }));
    } else {
      api = chart.addLineSeries(Object.assign(common, { color: x.color, lineWidth: x.width || 2,
        lineStyle: STYLE[x.style] || LC.LineStyle.Solid, crosshairMarkerRadius: 4,
        lineType: x.curved ? LC.LineType.Curved : LC.LineType.Simple, crosshairMarkerBorderColor: t.surface,
        pointMarkersVisible: !!x.points, pointMarkersRadius: 2.5 }));
    }
    return { spec: x, api: api, lines: [] };
  });
  userMoved = false;
  chart.subscribeCrosshairMove(p => { hover = p && p.time !== undefined ? p : null; legend(p); requestOverlay(); });
  chart.timeScale().subscribeVisibleLogicalRangeChange(requestOverlay);
}

// Once per page: any wheel, drag or touch counts as the user taking over the view; double-click
// hands it back. The chart follows the frame's width.
(function () {
  const box = document.getElementById('wrap');
  ['mousedown', 'wheel', 'touchstart'].forEach(ev => box.addEventListener(ev, () => { userMoved = true; }, { passive: true }));
  box.addEventListener('dblclick', () => { userMoved = false; resetView(); });
  const el = document.getElementById('chart');
  new ResizeObserver(() => { if (chart) { chart.applyOptions({ width: el.clientWidth }); requestOverlay(); } }).observe(el);
  box.addEventListener('pointermove', requestOverlay, {passive: true});
  box.addEventListener('wheel', requestOverlay, {passive: true});
  // A fill arrow's details follow the pointer while it is over the arrow (the arrow is the event target).
  const tip = document.getElementById('fill-tip');
  const hideTip = () => { if (tip) tip.hidden = true; };
  box.addEventListener('pointermove', ev => {
    const arrow = ev.target && ev.target.closest ? ev.target.closest('[data-detail]') : null;
    if (!tip || !arrow) { hideTip(); return; }
    tip.textContent = arrow.getAttribute('data-detail');
    tip.hidden = false;
    const area = box.getBoundingClientRect(), x = ev.clientX - area.left, y = ev.clientY - area.top;
    tip.style.left = Math.max(4, Math.min(box.clientWidth - tip.offsetWidth - 4, x + 14)) + 'px';
    tip.style.top = Math.max(4, Math.min(box.clientHeight - tip.offsetHeight - 4, y + 14)) + 'px';
  }, {passive: true});
  ['pointerleave', 'wheel', 'mousedown'].forEach(ev => box.addEventListener(ev, hideTip, {passive: true}));
})();

function resetView() {
  if (!chart) return;
  const n = Math.max(...entries.map(e => (e.spec.data || []).length), 0);
  if (spec.visibleRange) {
    chart.timeScale().setVisibleRange(spec.visibleRange);
  } else if (spec.initialFrom) {
    // Open on a recent window (the last few years); everything before is a scroll away.
    const ends = entries.map(e => (e.spec.data || []).slice(-1)[0]).filter(Boolean).map(d => d.time).sort();
    chart.timeScale().setVisibleRange({ from: spec.initialFrom, to: ends[ends.length - 1] });
  } else if (spec.initialBars && n > spec.initialBars) {
    chart.timeScale().setVisibleLogicalRange({ from: n - spec.initialBars, to: n + 6 });
  } else {
    chart.timeScale().fitContent();
  }
  chart.priceScale('right').applyOptions({ autoScale: true });
  if (entries.some(e => e.spec.scale === 'left')) chart.priceScale('left').applyOptions({ autoScale: true });
}

function fill(s) {
  const keep = userMoved ? chart.timeScale().getVisibleLogicalRange() : null;
  const bars = x => Math.max(0, ...x.map(e => ((e.spec || e).data || []).length));
  const before = bars(entries);
  entries.forEach((e, i) => {
    const x = s.series[i];
    e.spec = x;
    e.api.setData(x.data || []);
    if (e.volume) {
      const t = s.theme;
      e.volume.setData((x.data || []).filter(d => d.volume != null).map(d => ({ time: d.time, value: d.volume,
        color: (d.close >= d.open ? t.candleUp : t.candleDown) + '55' })));
    }
    e.lines.forEach(l => e.api.removePriceLine(l));
    e.lines = (x.lines || []).map(l => e.api.createPriceLine({
      price: l.price, color: l.color, lineWidth: l.width || 1, lineStyle: STYLE[l.style] || LC.LineStyle.Solid,
      axisLabelVisible: l.axisLabel !== false, title: l.title || '' }));
    e.api.setMarkers((x.markers || []).map(m => Object.assign({ position: 'aboveBar', shape: 'circle', size: 1 }, m)));
  });
  document.getElementById('title').textContent = s.title || '';
  if (keep) {
    // A view the user moved stays put, except that one reaching the newest bar keeps following it as new
    // bars arrive (a live trade), as on any trading platform.
    const added = keep.to > before - 1.5 ? Math.max(0, bars(s.series) - before) : 0;
    chart.timeScale().setVisibleLogicalRange({ from: keep.from + added, to: keep.to + added });
  } else resetView();
  legend(hover);
  requestOverlay();
}

function requestOverlay() {
  if (!overlayFrame) overlayFrame = requestAnimationFrame(() => { overlayFrame = 0; drawOverlay(); });
}

function drawOverlay() {
  const svg = document.getElementById('trade-overlay');
  svg.replaceChildren();
  if (!chart || !spec.tradeOverlays) return;
  const entry = entries.find(e => e.spec.type === 'candles');
  if (!entry) return;
  const width = document.getElementById('chart').clientWidth, height = spec.height;
  const plotWidth = width - chart.priceScale('right').width();
  const plotHeight = height - chart.timeScale().height();
  // A chart in a tab that is not showing has no width: nothing to draw until it is shown (the resize
  // observer draws it then), and an SVG rect may not be given a negative width.
  if (plotWidth <= 0 || plotHeight <= 0) return;
  svg.setAttribute('width', width); svg.setAttribute('height', height);
  const ns = 'http://www.w3.org/2000/svg';
  function element(tag, attrs, parent = svg, text) {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    if (text != null) node.textContent = text;
    parent.appendChild(node); return node;
  }
  const defs = element('defs', {}), clip = element('clipPath', {id:'trade-plot-clip'}, defs);
  element('rect', {x:0,y:0,width:plotWidth,height:plotHeight}, clip);
  const layer = element('g', {'clip-path':'url(#trade-plot-clip)'});
  const data = entry.spec.data || [];
  const anchor = data[0];
  const actualMinutes = new Set(data.filter(b => b.open != null).map(b => b.time));
  // Journal data includes whitespace minutes. Fractional logical coordinates preserve fill seconds.
  function xAt(time) {
    if (!anchor) return null;
    const scale = chart.timeScale(), minute = Math.floor(time / 60) * 60;
    const baseTime = actualMinutes.has(minute) ? minute : anchor.time;
    const base = scale.timeToCoordinate(baseTime);
    if (base == null) return null;
    const logical = scale.coordinateToLogical(base);
    const next = logical == null ? null : scale.logicalToCoordinate(logical + 1);
    if (next == null) return null;
    return base + (time - baseTime) / 60 * (next - base);
  }
  function line(x1,y1,x2,y2,color,dash) {
    return element('line',{x1,y1,x2,y2,stroke:color,'stroke-width':1.5,
      ...(dash ? {'stroke-dasharray':dash} : {})},layer);
  }
  for (const level of spec.tradeOverlays.levels || []) {
    // A full level (the stop R uses) crosses the whole chart, as a platform draws a stop; the others stand
    // over their own time (a stop order's later moves).
    const x1 = level.full ? 0 : xAt(level.from), x2 = level.full ? plotWidth : xAt(level.to);
    const y = entry.api.priceToCoordinate(level.price);
    if (x1 == null || x2 == null || y == null) continue;
    line(x1,y,x2,y,level.color,{dotted: '2 4', dashed: '7 4'}[level.style]);   // anything else is solid
    const labelY = Math.max(spec.title ? 64 : 28, y - 6); // keep stop labels below the title and OHLC legend
    const text = level.label + ' @ ' + formatter(spec.format)(level.price);
    // A full level's label sits at the plot's right edge, on the side of the line away from the entry: an exit
    // at the stop has its box on the entry's side, so the two never cover each other.
    const opening = ((spec.tradeOverlays || {}).fills || [])[0];
    const away = opening && level.price < opening.price ? Math.min(plotHeight - 4, y + 13) : labelY;
    if (level.full) element('text',{x:plotWidth - 6,y:away,fill:level.color,'font-size':10,'text-anchor':'end',
      'font-family':spec.theme.font},layer,text);
    else element('text',{x:Math.max(6, Math.min(plotWidth - 220, x2 - 220)),y:labelY,fill:level.color,'font-size':10,
      'font-family':spec.theme.font},layer,text);
  }
  const t = spec.theme, placed = new Map();     // each drawn fill's arrow tip, by its place in the trade's fills
  for (const fill of spec.tradeOverlays.fills || []) {
    if (!actualMinutes.has(Math.floor(fill.time / 60) * 60)) continue;
    const x = xAt(fill.time), y = entry.api.priceToCoordinate(fill.price);
    if (x == null || y == null) continue;
    placed.set(fill.sequence, {fill,x,y});
  }
  // Each entry joined to the exit that closed it, first in first out (chart.py closing_pairs): green where that
  // part made money, red where it lost, grey where it came out even.
  for (const pair of spec.tradeOverlays.pairs || []) {
    const a = placed.get(pair.entry), b = placed.get(pair.exit);
    if (a && b) line(a.x,a.y,b.x,b.y,pair.points > 0 ? t.candleUp : pair.points < 0 ? t.candleDown : t.muted,'4 3');
  }
  // Each fill as a platform marks it: a small arrowhead with its tip at the fill's price and time (not at a candle's
  // high or low), a buy pointing up from below and a sell down from above, short entries and covers included;
  // beside it a box with the signed size and price, a buy's below and a sell's above.
  const priceText = formatter(spec.format), boxes = [], boxHeight = 14, step = boxHeight + 2;
  const top = spec.title ? 52 : 30, bottom = plotHeight - boxHeight - 1;   // in the plot, below the title and legend
  // A fill scrolled out of view gets no arrow or box. A box goes where no other box is and over no fill's arrow, so
  // every fill's price stays in sight.
  const shown = [...placed.values()].filter(({x, y}) => x >= 0 && x <= plotWidth && y >= 0 && y <= plotHeight);
  const arrows = shown.map(({fill, x, y}) => ({x: x - 5, y: fill.side === 'buy' ? y : y - 7}));
  const free = (x, y, w) => !boxes.some(b => x < b.x + b.w + 2 && b.x < x + w + 2 && y < b.y + step && b.y < y + step)
    && !arrows.some(a => x < a.x + 10 && a.x < x + w && y < a.y + 7 && a.y < y + boxHeight);
  // A box's places on one side of the price, from `at` outward (way 1 down, -1 up), as far as the plot goes.
  const places = (at, way) => {
    const list = [];
    for (at = way > 0 ? Math.max(at, top) : Math.min(at, bottom); at >= top && at <= bottom; at += way * step) list.push(at);
    return list;
  };
  for (const {fill,x,y} of shown) {
    const detail = fill.side.toUpperCase() + ' · ' + fill.label + '\n' + timeLabel(fill.time,true)
      + '\nUTC ' + fill.ts;
    // No SVG <title>: the browser would show it in the system's font. #fill-tip shows data-detail instead.
    const group = element('g', {role:'img','aria-label':detail,'data-detail':detail},layer);
    const buy = fill.side === 'buy', direction = buy ? 1 : -1, colour = buy ? t.candleUp : t.candleDown;
    // Only the arrow takes the pointer: over a box the chart still zooms and pans.
    element('polygon',{points:[[x,y], [x-5,y+7*direction], [x+5,y+7*direction]].map(p => p.join(',')).join(' '),
      fill:colour,stroke:t.surface,'stroke-width':1,'stroke-linejoin':'round','pointer-events':'visiblePainted',
      class:'trade-fill-arrow','data-side':fill.side,'data-role':fill.role},group);
    const box = element('rect',{height:boxHeight,rx:2,fill:colour,class:'trade-fill-label'},group);
    const text = element('text',{'font-size':10,'font-weight':600,'font-family':t.font,fill:t.surface,
      'text-anchor':'middle'},group, (buy ? '+' : '−') + fill.qty.toLocaleString('en-US',
      {maximumFractionDigits: 8}) + ' @ ' + priceText(fill.price));
    const w = Math.ceil(text.getComputedTextLength()) + 8, left = Math.max(1, Math.min(plotWidth - w - 1, x - w / 2));
    // Its place by the arrow; if that is taken, the nearest free place further from the price. With no room on that
    // side (a sell at the top of the plot, a buy at the bottom), the other side of the price: never over its own arrow.
    const tops = [...places(buy ? y + 9 : y - 9 - boxHeight, direction),
                  ...places(buy ? y - 9 - boxHeight : y + 9, -direction)];
    const at = tops.find(at => free(left, at, w)) ?? tops[0] ?? top;
    box.setAttribute('x', left); box.setAttribute('y', at); box.setAttribute('width', w);
    text.setAttribute('x', left + w / 2); text.setAttribute('y', at + 10.5);
    boxes.push({x:left, y:at, w});
  }
}

function legend(param) {
  const box = document.getElementById('legend');
  if (!spec || spec.legend === false) { box.innerHTML = ''; return; }
  const t = spec.theme;
  box.innerHTML = entries.filter(e => e.spec.legend !== false).map(e => {
    const x = e.spec, fmt = formatter(x.format || spec.format);
    // The bar at the hovered time as it is now: a live chart's newest bar changes under a resting pointer.
    let point = param && param.time !== undefined
      ? ((x.data || []).find(b => b.time === param.time) || param.seriesData.get(e.api)) : null;
    if (!point) { const d = x.data || []; point = d.length ? d[d.length - 1] : null; }
    let text = '–';
    if (point) {
      if (x.type === 'candles') {
        const up = point.close >= point.open, c = up ? t.candleUp : t.candleDown;
        const d = x.data || [], i = d.findIndex(b => b.time === point.time), prev = i > 0 ? d[i - 1].close : point.open;
        const chg = point.close - prev, pct = prev ? chg / prev * 100 : 0, sign = chg >= 0 ? '+' : '';
        if (point.open == null) return '';
        text = ['O', 'H', 'L', 'C'].map((k, j) => `<span style="color:${t.muted}">${k}</span> ` +
          `<span style="color:${c}">${escapeText(fmt([point.open, point.high, point.low, point.close][j]))}</span>`).join(' ') +
          ` <span style="color:${chg >= 0 ? t.candleUp : t.candleDown}">${sign}${fmt(chg)} (${sign}${pct.toFixed(2)}%)</span>`;
        const full = i >= 0 ? d[i] : null;
        if (full && full.volume != null) text += ` <span style="color:${t.muted}">Vol</span> <span style="color:${t.ink2}">` +
          Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(full.volume) + '</span>';
      } else {
        text = `<span style="color:${t.ink}">${fmt(point.value)}</span>`;
      }
    }
    const colour = x.type === 'candles' ? t.ink2 : x.color;
    return `<span class="item"><span class="dot" style="background:${colour}"></span>` +
           `<span class="name" style="color:${t.ink2}">${escapeText(x.name)}</span>${text}</span>`;
  }).join('');
}

function render(args) {
  spec = args.spec;
  const s = sig(spec);
  if (s !== signature || !chart) { build(spec); signature = s; }
  fill(spec);
  post('streamlit:setFrameHeight', { height: spec.height + 2 });
}

window.addEventListener('message', ev => {
  const d = ev.data;
  if (d && d.type === 'streamlit:render') {
    fontReady.then(() => {
      try { render(d.args); }
      catch (err) { document.getElementById('chart').textContent = 'Chart error: ' + err.message;
                    post('streamlit:setFrameHeight', { height: 40 }); }
    });
  }
});
post('streamlit:componentReady', { apiVersion: 1 });
</script>
</body>
</html>
